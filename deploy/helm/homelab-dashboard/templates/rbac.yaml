{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "homelab-dashboard.fullname" . }}
  labels:
    {{- include "homelab-dashboard.labels" . | nindent 4 }}
rules:
  # Read-only. Secrets and ConfigMaps are deliberately not included.
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "homelab-dashboard.fullname" . }}
  labels:
    {{- include "homelab-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "homelab-dashboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "homelab-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
